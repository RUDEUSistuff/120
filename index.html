<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Smart Calculator Hub</title>

<!-- مكتبات -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/decimal.js/10.4.3/decimal.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;padding:20px;font-family:'Segoe UI',Arial;background:radial-gradient(#0a0f2a,#03050b);color:white;text-align:center}
.hidden{display:none}
button{padding:10px;margin:5px;border-radius:10px;background:#556;cursor:pointer;color:white}
input{padding:10px;width:80%;margin:10px}
</style>
</head>

<body>

<h1>AI Smart Calculator Hub</h1>

<!-- MENU -->
<div id="menu">
<button onclick="showPage('math')">Math</button>
<button onclick="showPage('physics')">Physics</button>
<button onclick="showPage('ai3d')">3D</button>
</div>

<!-- MATH -->
<div id="math" class="hidden">
<h2>Math</h2>

<input id="mathInput">

<br>
<button onclick="add('+')">+</button>
<button onclick="add('-')">-</button>
<button onclick="add('*')">*</button>
<button onclick="add('/')">/</button>
<button onclick="add('Math.sqrt(')">√</button>
<button onclick="add('Math.sin(')">sin</button>
<button onclick="add('Math.cos(')">cos</button>
<button onclick="add('Math.tan(')">tan</button>
<button onclick="add('Math.log(')">log</button>
<button onclick="add('Math.PI')">π</button>

<br>
<button onclick="calc()">Calculate</button>

<div id="res"></div>

<button onclick="showPage('menu')">Back</button>
</div>

<!-- PHYSICS -->
<div id="physics" class="hidden">
<h2>Physics Laws</h2>

<button onclick="law('F = m × a')">Force</button>
<button onclick="law('P = F / A')">Pressure</button>
<button onclick="law('E = mgh')">Potential Energy</button>
<button onclick="law('Ek = ½mv²')">Kinetic Energy</button>
<button onclick="law('V = IR')">Ohm</button>
<button onclick="law('W = F × d')">Work</button>
<button onclick="law('P = W / t')">Power</button>
<button onclick="law('ρ = m / V')">Density</button>
<button onclick="law('p = mv')">Momentum</button>
<button onclick="law('v = d / t')">Velocity</button>
<button onclick="law('a = v / t')">Acceleration</button>
<button onclick="law('F = kx')">Hooke</button>
<button onclick="law('E = mc²')">Einstein</button>
<button onclick="law('Q = mcΔT')">Heat</button>
<button onclick="law('f = 1/T')">Frequency</button>
<button onclick="law('λ = v / f')">Wave</button>

<div id="lawRes"></div>

<button onclick="showPage('menu')">Back</button>
</div>

<!-- 3D -->
<div id="ai3d" class="hidden">
<h2>3D Shapes</h2>

<button onclick="createCube()">Cube</button>
<button onclick="createSphere()">Sphere</button>

<div id="canvas3d"></div>

<button onclick="showPage('menu')">Back</button>
</div>

<script>

// NAV
function showPage(p){
['menu','math','physics','ai3d'].forEach(x=>{
document.getElementById(x).classList.add('hidden')
});
document.getElementById(p).classList.remove('hidden')
}

// MATH
function add(v){
document.getElementById('mathInput').value+=v
}

function calc(){
try{
let r=eval(document.getElementById('mathInput').value)
document.getElementById('res').innerHTML="Result: "+r
}catch{
document.getElementById('res').innerHTML="Error"
}
}

// PHYSICS
function law(x){
document.getElementById('lawRes').innerHTML=x
}

// 3D
let scene,camera,renderer,cube;

function init3D(){
scene=new THREE.Scene();
camera=new THREE.PerspectiveCamera(75,1,0.1,1000);
renderer=new THREE.WebGLRenderer();
renderer.setSize(300,300);
document.getElementById('canvas3d').innerHTML='';
document.getElementById('canvas3d').appendChild(renderer.domElement);
camera.position.z=5;
}

function animate(){
requestAnimationFrame(animate);
if(cube){
cube.rotation.x+=0.01;
cube.rotation.y+=0.01;
}
renderer.render(scene,camera);
}

function createCube(){
init3D();
let geo=new THREE.BoxGeometry();
let mat=new THREE.MeshBasicMaterial({color:0x00ff00,wireframe:true});
cube=new THREE.Mesh(geo,mat);
scene.add(cube);
animate();
}

function createSphere(){
init3D();
let geo=new THREE.SphereGeometry();
let mat=new THREE.MeshBasicMaterial({color:0x00ffff,wireframe:true});
cube=new THREE.Mesh(geo,mat);
scene.add(cube);
animate();
}

</script>

</body>
</html>
